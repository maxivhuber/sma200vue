name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Node line as the Docker build (node:lts-alpine).
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npx eslint .
      - run: npx prettier --check src/
      - run: npm run build-only
