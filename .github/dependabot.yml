version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all non-breaking bumps; majors arrive as separate PRs.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 dropped the JS compiler API that vue-tsc and typescript-eslint
      # (peer: typescript <6.1.0) build on. Remove once both support TS 7.
      - dependency-name: typescript
        versions: ['>=6.1.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
